name: Dev Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated Dev Build platforms (win-x64, linux-x64, linux-arm64, linux-x64-vnc, linux-arm64-vnc)
        required: false
        default: "linux-arm64-vnc"
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v8
        with:
          script: |
            let page = 1;
            while (true) {
              const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (artifacts.length === 0) break;
              for (const artifact of artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`Deleted artifact: ${artifact.name}`);
              }
              page++;
            }

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check all packages
        run: pnpm typecheck

  # ---------- 新增：根据触发事件生成构建矩阵 ----------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # 定义所有平台配置（与原来完全一致）
          ALL_INCLUDES='[
            {"name":"win-x64","os":"windows-latest","target":"win32-x64"},
            {"name":"linux-x64","os":"ubuntu-latest","target":"linux-x64"},
            {"name":"linux-arm64","os":"ubuntu-24.04-arm","target":"linux-arm64"},
            {"name":"linux-x64-vnc","os":"ubuntu-latest","target":"linux-x64","vnc":true},
            {"name":"linux-arm64-vnc","os":"ubuntu-24.04-arm","target":"linux-arm64","vnc":true}
          ]'

          # 根据触发事件决定平台列表
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PLATFORMS="${{ github.event.inputs.platforms }}"
          else
            # push 时构建全部平台
            PLATFORMS="win-x64,linux-x64,linux-arm64,linux-x64-vnc,linux-arm64-vnc"
          fi

          # 去除可能多余的空格，并转为 JSON 数组
          PLATFORMS=$(echo "$PLATFORMS" | tr -d ' ')
          SELECTED_JSON=$(echo "$PLATFORMS" | jq -R 'split(",")')

          # 过滤 ALL_INCLUDES，只保留 .name 在 SELECTED_JSON 中的项
          FILTERED=$(echo "$ALL_INCLUDES" | jq --argjson selected "$SELECTED_JSON" '[.[] | select(.name as $n | $selected | index($n))]')
          echo "matrix=$FILTERED" >> $GITHUB_OUTPUT

  build:
    needs: [cleanup, typecheck, setup]          # 等待 setup 完成
    if: ${{ needs.setup.outputs.matrix != '[]' }}  # 矩阵为空时跳过构建
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}   # 动态矩阵
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build project
        env:
          SNOWLUMA_TARGET: ${{ matrix.target }}
          VITE_VNC_ENABLED: ${{ matrix.vnc && 'true' || '' }}
        run: pnpm run build:all

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "SnowLuma-dev-${{ matrix.name }}-lite.zip"
          Copy-Item (Get-Command node).Source -Destination "dist\node.exe"
          Compress-Archive -Path "dist\*" -DestinationPath "SnowLuma-dev-${{ matrix.name }}.zip"

      - name: Package (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          chmod +x dist/launcher.sh
          tar -czf "SnowLuma-dev-${{ matrix.name }}-lite.tar.gz" -C dist .
          cp "$(command -v node)" dist/node
          chmod +x dist/node
          tar -czf "SnowLuma-dev-${{ matrix.name }}.tar.gz" -C dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SnowLuma-dev-${{ github.sha }}-${{ matrix.name }}
          path: SnowLuma-dev-${{ matrix.name }}*
          retention-days: 3
          overwrite: true
          if-no-files-found: error
